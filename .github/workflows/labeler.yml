# Gán nhãn PR theo file đổi — cấu hình: .github/labeler.yml
# PR từ fork: đổi trigger sang pull_request_target và đọc kỹ cảnh báo bảo mật của GitHub.
name: Pull request labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
