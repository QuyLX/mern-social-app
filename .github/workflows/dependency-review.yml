# So sánh manifest trên PR với cơ sở dữ liệu advisory của GitHub.
# Repo public: thường chạy miễn phí. Repo private: cần GitHub Advanced Security (tùy gói).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4
